{{define "bill_list_content"}}
<div class="space-y-8">
    <div class="text-center space-y-2">
        <h1 class="text-3xl font-bold">Michigan Bill Tracker</h1>
        <p class="text-muted-foreground">
            Track bills scheduled for voting and contact your representatives
        </p>
    </div>

    <div class="space-y-4">
        <div class="flex gap-2 border-b" id="tab-bar">
            <button data-tab="scheduled"
                hx-get="/bills/scheduled" hx-target="#tab-content" hx-swap="innerHTML"
                class="px-4 py-2 text-sm font-medium border-b-2 border-primary text-primary transition-colors">
                Scheduled Votes ({{.ScheduledCount}})
            </button>
            <button data-tab="all"
                hx-get="/bills/all" hx-target="#tab-content" hx-swap="innerHTML"
                class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-muted-foreground hover:text-foreground transition-colors">
                All Bills ({{.AllCount}})
            </button>
            <button data-tab="meetings"
                hx-get="/bills/meetings" hx-target="#tab-content" hx-swap="innerHTML"
                class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-muted-foreground hover:text-foreground transition-colors">
                Committee Meetings ({{.MeetingsCount}})
            </button>
        </div>

        <div id="tab-content">
            {{template "scheduled_tab" .}}
        </div>
    </div>
</div>

<script>
    document.getElementById('tab-bar').addEventListener('click', function(e) {
        var btn = e.target.closest('[data-tab]');
        if (!btn) return;
        document.querySelectorAll('[data-tab]').forEach(function(t) {
            t.classList.remove('border-primary', 'text-primary');
            t.classList.add('border-transparent', 'text-muted-foreground');
        });
        btn.classList.remove('border-transparent', 'text-muted-foreground');
        btn.classList.add('border-primary', 'text-primary');
    });
</script>
{{end}}

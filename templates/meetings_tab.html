{{define "meetings_tab"}}
<div id="meetings-tab-content" class="space-y-4">
    {{if .Meetings}}
        {{range .Meetings}}
            {{template "meeting_card" (dict "Meeting" . "MeetingDate" (formatDate .Date))}}
        {{end}}
    {{else}}
        <div class="text-center py-12 text-muted-foreground">
            No upcoming committee meetings
        </div>
    {{end}}
</div>
{{end}}

{{define "email_preview"}}
<div id="preview-content" class="border rounded-lg p-4 space-y-2 bg-muted">
    <h3 class="font-medium">Preview</h3>
    <div class="text-sm">
        <span class="font-medium">Subject:</span> {{.Subject}}
    </div>
    <pre class="text-sm whitespace-pre-wrap bg-background p-3 rounded border font-sans">{{.Body}}</pre>
</div>
{{end}}

{{define "all_bills_tab"}}
<div id="all-bills-tab-content" class="space-y-4">
    <div class="relative">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"><polygon points="22 3 22 7 6 7 6 3"/><path d="M6 3h16v4l-4 4v6l-4 2v-8L6 7z"/><path d="M2 3h4v4l-4 2z"/></svg>
        <input
            type="text"
            name="q"
            placeholder="Filter bills by title, number, or sponsor..."
            hx-get="/bills/filter"
            hx-trigger="keyup delay:300ms"
            hx-target="#all-bills-list"
            hx-swap="innerHTML"
            value="{{.Query}}"
            class="w-full pl-10 pr-4 py-2 border rounded-md bg-background text-foreground"
        />
    </div>
    <div id="all-bills-list">
        {{if .AllBills}}
            {{range .AllBills}}
                {{template "bill_card" (dict "Bill" . "IsUrgent" (isUrgent .ScheduledVote) "VoteDate" (formatDate .ScheduledVote.Date))}}
            {{end}}
        {{else}}
            <div class="text-center py-12 text-muted-foreground">
                No bills match your filter
            </div>
        {{end}}
    </div>
</div>
{{end}}
